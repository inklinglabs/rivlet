# Temporary probe: build the real app unsigned and package it the way the
# release workflow does, several ways, to find which hdiutil path writes
# a valid DMG on the current macos-latest image. Run by hand; delete once
# the release workflow is fixed.
name: DMG probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image info
        run: sw_vers
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Rivlet.xcodeproj -scheme Rivlet -configuration Release \
            -derivedDataPath build build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -3
          du -sh build/Build/Products/Release/Rivlet.app
      - name: Try variants
        run: |
          STAGING=$(mktemp -d)
          cp -R build/Build/Products/Release/Rivlet.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          ls -la@ "$STAGING" "$STAGING/Rivlet.app/Contents" | head -30
          mkdir out
          check() {
            f=$1
            echo "size: $(stat -f %z "$f")"
            if hdiutil imageinfo "$f" >/dev/null 2>&1; then echo "RESULT $f: VALID"; else echo "RESULT $f: CORRUPT"; fi
          }
          for i in 1 2 3; do
            echo "=== udzo-hfs attempt $i"
            hdiutil create -volname "Rivlet 1.1.0" -srcfolder "$STAGING" -fs HFS+ -format UDZO "out/udzo-hfs-$i.dmg" | tail -1
            check "out/udzo-hfs-$i.dmg"
          done
          echo "=== udzo-apfs"
          hdiutil create -volname "Rivlet 1.1.0" -srcfolder "$STAGING" -fs APFS -format UDZO out/udzo-apfs.dmg | tail -1
          check out/udzo-apfs.dmg
          echo "=== ulfo-hfs"
          hdiutil create -volname "Rivlet 1.1.0" -srcfolder "$STAGING" -fs HFS+ -format ULFO out/ulfo-hfs.dmg | tail -1
          check out/ulfo-hfs.dmg
          echo "=== udrw then convert"
          hdiutil create -volname "Rivlet 1.1.0" -srcfolder "$STAGING" -fs HFS+ -format UDRW out/rw.dmg | tail -1
          check out/rw.dmg
          hdiutil convert out/rw.dmg -format UDZO -o out/converted.dmg | tail -1
          check out/converted.dmg
          echo "=== udzo-hfs without the Applications symlink"
          rm "$STAGING/Applications"
          hdiutil create -volname "Rivlet 1.1.0" -srcfolder "$STAGING" -fs HFS+ -format UDZO out/udzo-nolink.dmg | tail -1
          check out/udzo-nolink.dmg
          echo "=== udzo-hfs with xattrs stripped"
          xattr -cr "$STAGING"
          hdiutil create -volname "Rivlet 1.1.0" -srcfolder "$STAGING" -fs HFS+ -format UDZO out/udzo-noxattr.dmg | tail -1
          check out/udzo-noxattr.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-probe
          path: out/*.dmg
